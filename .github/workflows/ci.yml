name: CI

# Pushes to master and pull requests: where checks matter.
on:
  push:
    branches: [master]
  pull_request:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI runners have no GPU; render iced_test UIs in software.
  ICED_TEST_BACKEND: tiny-skia

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its parents, to see what it changes.
          fetch-depth: 2
      # A pull request that only touches the website skips the Rust steps. The
      # job itself still runs and passes: it's a required check, and a skipped
      # required check would block the merge.
      - name: What changed
        id: changes
        run: |
          # No pipe into grep -q: it stops reading early, which fails the pipe.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [[ "${{ github.event_name }}" == pull_request ]] &&
            ! grep -qvE '^(website/|\.github/workflows/website\.yml$)' <<< "$changed"; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Only the website changed: skipping the Rust checks."
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.rust == 'true'
        with:
          components: clippy, rustfmt
      # Caches ~/.cargo and target/ between runs; the biggest time (and minutes) saver.
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: cargo fmt --all --check
        if: steps.changes.outputs.rust == 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: steps.changes.outputs.rust == 'true'
      - run: cargo test --workspace --locked
        if: steps.changes.outputs.rust == 'true'
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          command: check bans

  # Desktop integration files (packaging/): what app menus and software
  # centers read. Not a required check.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream
      - run: desktop-file-validate packaging/dev.gorkemkaryol.rigcheck.desktop
      - run: appstreamcli validate --no-net --explain packaging/dev.gorkemkaryol.rigcheck.metainfo.xml

