name: Website

# Builds the showcase site on pull requests that touch it. Cloudflare Pages
# deploys it from master.
on:
  pull_request:
    paths:
      - .github/workflows/website.yml
      - website/**
      - assets/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
