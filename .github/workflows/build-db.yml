name: Build games.db

# Every 4 hours: continue crawling Steam where the last run stopped, merge
# the data sources, validate, and save the result to the `db-wip` release.
# Once a day (the 03:17 run) it's also published to `db-latest`, the release
# the app downloads (ROADMAP Phase 4, §7.3): users get one update a day,
# while the crawl uses the whole day. Steam limits requests per 5 minutes,
# not per day, so six runs crawl six times as much.
#
# Two jobs. `build` handles third-party data (Steam, ProtonDB, AWACY, Blender,
# pci.ids) with a read-only token; `publish` holds the write token and runs
# none of that data, only `gh` on the finished files.
on:
  schedule:
    - cron: "17 3 * * *" # crawl and publish
    - cron: "17 7,11,15,19,23 * * *" # crawl only
  workflow_dispatch:
    inputs:
      budget:
        description: Games to crawl this run (each is 2 store requests)
        default: "3000"
      publish:
        description: Publish to db-latest (the app's release), not only db-wip
        type: boolean
        default: false

permissions:
  contents: read

# Never two crawls at once: they'd race on the release.
concurrency:
  group: build-db
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PIPELINE: target/pipeline/rigcheck-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # GitHub's limit is 360; publish needs a few minutes
    env:
      GH_TOKEN: ${{ github.token }} # read-only: download the last run's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --profile pipeline --locked -p rigcheck-pipeline

      # db-wip holds the last run's work; db-latest is the fallback until a
      # run has saved one.
      - name: Restore the last run's database
        run: |
          for release in db-wip db-latest; do
            if gh release download "$release" --pattern games.db.zst --dir previous; then
              echo "Continuing from $release."
              zstd -d previous/games.db.zst -o games.db
              exit 0
            fi
          done
          echo "No previous release; starting fresh."

      # Everything downloaded lands in sources/, never next to the pipeline
      # binary in target/: an archive can't overwrite what runs next.
      - name: Download data sources
        run: |
          set -euo pipefail
          mkdir -p sources
          # ProtonDB: the newest monthly dump (names like reports_oct1_2026.tar.gz).
          dump=$(gh api repos/bdefore/protondb-data/contents/reports --jq '.[].name' | python3 -c '
          import re, sys, datetime
          def when(name):
              m = re.match(r"reports_([a-z]+)(\d+)_(\d{4})\.tar\.gz", name)
              return datetime.datetime.strptime(f"{m[1]} {m[2]} {m[3]}", "%b %d %Y") if m else datetime.datetime.min
          print(max(sys.stdin.read().split(), key=when))')
          echo "ProtonDB dump: $dump"
          # Only the one file we read, into sources/.
          curl -sfL "https://github.com/bdefore/protondb-data/raw/master/reports/$dump" \
            | tar -xz --no-same-owner --no-same-permissions -C sources reports_piiremoved.json
          curl -sfL -o sources/awacy.json https://raw.githubusercontent.com/AreWeAntiCheatYet/AreWeAntiCheatYet/master/games.json
          curl -sfL -o sources/blender.zip https://opendata.blender.org/snapshots/opendata-latest.zip
          unzip -p sources/blender.zip '*.jsonl' > sources/blender.jsonl
          curl -sfL -o sources/pci.ids https://pci-ids.ucw.cz/v2.2/pci.ids
          # Plain files only: a symlink could point the pipeline at another file.
          for f in reports_piiremoved.json awacy.json blender.jsonl pci.ids; do
            test -f "sources/$f" && ! test -L "sources/$f"
          done
          ls -la sources

      - name: Fetch the app list
        run: $PIPELINE applist apps.json
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      # Saved progress survives a timeout: the next steps still publish it.
      - name: Crawl
        timeout-minutes: 240
        continue-on-error: true
        env:
          BUDGET: ${{ inputs.budget || '3000' }}
        run: $PIPELINE crawl apps.json games.db "$BUDGET" sources/reports_piiremoved.json

      - name: Build
        run: $PIPELINE build games.db apps.json sources/reports_piiremoved.json sources/awacy.json sources/pci.ids sources/blender.jsonl

      - name: Validate
        run: $PIPELINE validate games.db

      - name: Unknown hardware (for data/hardware.toml)
        run: |
          {
            echo "## Most-mentioned hardware missing from data/hardware.toml"
            echo '```'
            $PIPELINE report games.db | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          $PIPELINE publish games.db out \
            "$(date -u +%Y-%m-%d).${{ github.run_number }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "https://github.com/${{ github.repository }}/releases/download/db-latest/games.db.zst" \
            "0.4.0"
          cat out/manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-db
          path: |
            out/games.db.zst
            out/manifest.json
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
      actions: write # re-enable this workflow so GitHub doesn't pause it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: games-db
          path: out

      - name: Save to the db-wip release
        run: |
          if ! gh release view db-wip > /dev/null 2>&1; then
            gh release create db-wip --prerelease --title "games.db (work in progress)" \
              --notes "The crawl's progress between daily releases, saved every few hours by the Build games.db workflow. rigcheck downloads db-latest, not this. Licensed under the ODbL."
          fi
          gh release upload db-wip out/games.db.zst out/manifest.json --clobber

      - name: Publish to the db-latest release
        if: github.event.schedule == '17 3 * * *' || inputs.publish
        run: |
          if ! gh release view db-latest > /dev/null 2>&1; then
            gh release create db-latest --prerelease --title "games.db (updated daily)" \
              --notes "The game database rigcheck downloads. Rebuilt daily by the Build games.db workflow. Licensed under the ODbL (see the license and sources rows in its meta table)."
          fi
          gh release upload db-latest out/games.db.zst out/manifest.json --clobber

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling through the API resets that, without a commit (master
      # only takes pull requests).
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build-db.yml/enable"
