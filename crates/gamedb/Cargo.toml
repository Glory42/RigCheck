[package]
name = "rigcheck-gamedb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Ed25519, to check manifest.json's signature. Already built for rustls
# (reqwest's TLS), with the same features.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
rigcheck-core = { version = "1.1.0", path = "../core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
zstd = "0.14.3"

[dev-dependencies]
# Tests tamper with a built file the way an attacker could.
rusqlite = { version = "0.41.1", features = ["bundled"] }
rigcheck-hardware = { version = "1.1.0", path = "../hardware" }
tempfile = "3.27.0"
