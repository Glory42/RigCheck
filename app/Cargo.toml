[package]
name = "rigcheck"
description = "Can my PC run this game? A Linux desktop app for Steam."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = "6.0.0"
fluent-bundle = "0.16"
# `image` decodes the PNG window icon now and cover art later.
iced = { version = "0.14", features = ["image"] }
rigcheck-core = { version = "0.0.0", path = "../crates/core" }
rigcheck-gamedb = { version = "0.0.0", path = "../crates/gamedb" }
rigcheck-hardware = { path = "../crates/hardware" }
rigcheck-steam = { version = "0.0.0", path = "../crates/steam" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unic-langid = "0.9"

[dev-dependencies]
iced_test = "0.14"
tempfile = "3.27.0"
