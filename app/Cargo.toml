[package]
name = "rigcheck"
description = "Can my PC run this game? A Linux desktop app for Steam."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `image` decodes the PNG window icon now and cover art later.
iced = { version = "0.14", features = ["image"] }

[dev-dependencies]
iced_test = "0.14"
